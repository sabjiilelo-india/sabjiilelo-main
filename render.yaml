# Render blueprint: API (Node web service) + web app (static site).
# The database is Neon Postgres in Singapore (ap-southeast-1); the API runs in Singapore next to it,
# so each database call takes a few milliseconds instead of a few hundred.
services:
  - type: web
    name: sabjiilelo-api
    runtime: node
    region: singapore
    plan: starter
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @sabjiilelo/api build && pnpm --filter @sabjiilelo/api db:deploy
    startCommand: cd apps/api && node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.19.0
      # Use Neon's DIRECT address (host without '-pooler') plus ?connection_limit=10 for this long-running server.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://sabjiilelo-web.onrender.com
      - key: PUBLIC_URL
        value: https://sabjiilelo-api.onrender.com
      - key: OTP_MODE
        value: fixed
      - key: OTP_FIXED
        value: "9999"
      - key: SUPERADMIN_USERNAME
        sync: false
      - key: SUPERADMIN_PASSWORD
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # Render disks are wiped on deploy: set this before staff upload real photos.
      - key: CLOUDINARY_URL
        sync: false

  - type: web
    name: sabjiilelo-web
    runtime: static
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @sabjiilelo/web build
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_URL
        value: /api
    routes:
      # Same-origin API keeps the refresh cookie first-party (no third-party cookie issues).
      - type: rewrite
        source: /api/*
        destination: https://sabjiilelo-api.onrender.com/api/*
      - type: rewrite
        source: /uploads/*
        destination: https://sabjiilelo-api.onrender.com/uploads/*
      - type: rewrite
        source: /*
        destination: /index.html
